services:
  scan-stack-splitter:
    build: .
    # Published images can be used instead of a local build:
    # image: ghcr.io/tom-joad/scan-stack-splitter:latest
    container_name: scan-stack-splitter
    restart: unless-stopped

    # Run as the owner of the data share so output files stay editable over
    # SMB/NFS (Unraid: nobody:users = 99:100).
    user: "${PUID:-1000}:${PGID:-1000}"

    env_file:
      - .env

    volumes:
      # Holds stacks/, scanner/ and work/ (see README > Quick start).
      - ${DATA_PATH:-./data}:/data

    read_only: true
    tmpfs:
      # ocrmypdf renders every page here; size it for the largest stack.
      - /tmp:size=8g
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
