services:
  scanbutler:
    image: ghcr.io/tom-joad/scanbutler:latest
    # Or build from this checkout instead:
    # build: .
    container_name: scanbutler
    restart: unless-stopped

    env_file:
      - .env

    # linuxserver.io conventions: the container starts as root, gives the
    # abc user these IDs and runs Scanbutler as abc. Use the owner of the
    # data folder (Unraid: nobody:users = 99:100). Don't set `user:`.
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-022}
      TZ: ${TZ:-Etc/UTC}

    volumes:
      # Work folder: plans, caches, the Paperless upload ledger, and the
      # temporary page images (several GB while a large stack runs).
      - ${CONFIG_PATH:-./config}:/config
      # stacks/, scanner/ and paperless/ (see README > Quick start).
      - ${DATA_PATH:-./data}:/data

    # The HTTP API, with API_ENABLED=true in .env (README > HTTP API).
    # ports:
    #   - "8484:8080"

    # OCR jobs adapt to this limit: less memory makes processing slower, not
    # fail. 4 GB lets all inputs run at once; 1 GB is the tested minimum.
    mem_limit: 4g

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
