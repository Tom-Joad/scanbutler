services:
  scanbutler:
    build: .
    # Published images can be used instead of a local build:
    # image: ghcr.io/tom-joad/scanbutler:latest
    container_name: scanbutler
    restart: unless-stopped

    # Run as the owner of the data share so output files stay editable over
    # SMB/NFS (Unraid: nobody:users = 99:100).
    user: "${PUID:-1000}:${PGID:-1000}"

    env_file:
      - .env

    volumes:
      # Holds stacks/, scanner/ and work/ (see README > Quick start).
      - ${DATA_PATH:-./data}:/data

    # OCR jobs adapt to this limit: less memory makes processing slower, not
    # fail. 4 GB lets all inputs run at once; 1 GB is the tested minimum.
    mem_limit: 4g

    environment:
      # Page images go to disk: a RAM-backed /tmp would count against mem_limit.
      TMPDIR: /data/work/tmp

    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
